# Offboard only: rgb -> h264_encoder ==network==> h264_decoder -> detection
# (RF-DETR), with detection_log logging its boxes on lambda

[[producers]]
name = "vehicle.rgb"
tokens = 1

[[engines]]
name = "local.h264_encoder"
location = "local"

[[engines]]
name = "remote.h264_decoder"
location = "remote"

[[engines]]
name = "remote.detection"
location = "remote"

[[engines]]
name = "remote.detection_log"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.h264_encoder"
timeout = "2s"

[[edges]]
from = "local.h264_encoder"
to = "remote.h264_decoder"
timeout = "30s"

[[edges]]
from = "remote.h264_decoder"
to = "remote.detection"
timeout = "30s"

[[edges]]
from = "remote.h264_decoder"
to = "remote.detection_log"
timeout = "30s"
