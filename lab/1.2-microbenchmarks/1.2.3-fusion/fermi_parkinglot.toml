# fermi for 1.2.3 fusion: YOLO (QNN) on fermi and RF-DETR 2XL on lambda2, fused on fermi: parkinglot
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays parkinglot.mp4 once; logs each frame
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
[services.plugin.args]
video = "parkinglot.mp4"
no_loop = true
frame_log = "mb/frames.csv"

# YOLO26 on the HTP (detection-qnn, COCO)
[[services]]
name = "yolo"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"

# Logs each frame yolo finishes
[[services]]
name = "local_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/local.csv"

# The Tachyon's hardware H.264 encoder, as in live/
[[services]]
name = "h264_encoder"
type = "engine"
[services.plugin]
plugin = "encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/h264@v4_backend_rework"
environment = "native"
[services.plugin.args]
decoder_name = "h264_decoder"
converter = "qtivtransform ! video/x-raw(memory:GBM),format=NV12"
encoder = "qtic2venc control-rate=disable b-frames=0 idr-interval=30"

# Fuses yolo's and rfdetr's detections of each frame
[[services]]
name = "fusion"
type = "engine"
[services.plugin]
plugin = "fusion_detection"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/fusion@v4_backend_rework"
[services.plugin.args]
local = "yolo"
remote = "rfdetr"
