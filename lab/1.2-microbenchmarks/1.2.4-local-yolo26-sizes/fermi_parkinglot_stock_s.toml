# fermi for 1.2.4 local: YOLO26 n/s/m/l (QNN, 640x384, COCO + robotic dog) on fermi, nothing sent: parkinglot_stock_s
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays parkinglot.mp4 once; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "parkinglot.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"

# YOLO26 on the HTP (detection-qnn, COCO): every frame forwarded
[[services]]
name = "yolo"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"
[services.plugin.args]
model = "libs640x384_v26_quant.so"

# Logs each frame yolo processed (frame_id, timestamp_ns, seq, its boxes), for effective recall
[[services]]
name = "yolo_log"
type = "engine"
[services.plugin]
plugin = "detection-log"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-log@v4_backend_rework"
[services.plugin.args]
detector = "yolo"
images = false
csv = "mb/scored.csv"

# Logs each frame reaching the end of the pipeline
[[services]]
name = "sink_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/sink.csv"
