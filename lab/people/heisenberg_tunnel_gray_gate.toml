# heisenberg (Tachyon): replays tunnel_720p.mp4 through YOLO (COCO) on the HTP
# and box_rerank, looking for "person in light blue shirt and dark pants, brown hair" (Qwen's description of the photo
# gray_shirt.png); the crops go to lambda's verifier, which compares each
# with that photo

[daemon]
cert = ""
hostname = "heisenberg"
lcs = 9001
logs = 9002
metrics_port = 9393
orchestrator = "lambda:9000"
port = 9000

# Replays tunnel_720p.mp4 once; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "tunnel_720p.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"

# YOLO26 (COCO) on the HTP, at a low confidence, so box_rerank sees the
# people YOLO is unsure of too
[[services]]
name = "detection_qnn"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"
[services.plugin.args]
backend = "/home/particle/cpp_server_build/libs/libQnnHtp.so"
only_classes = ["person"]
confidence = 0.25
nms_score_threshold = 0.25

# Reports at most one "gray shirt" a frame among YOLO's people: the target is
# described in text for CLIP, and by the photo for the verifier. Until the
# verifier confirms him, the person most like the text (of those from 0.5)
# is reported
[[services]]
name = "box_rerank"
type = "engine"
[services.plugin]
plugin = "box_rerank"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
detector = "detection_qnn"
verifier = "verifier"
class = "gray shirt"
classes = ["person"]
# CLIP ranks a frame's people by a text description: image-to-image
# similarity doesn't tell people apart, text naming their clothes does
prompt = "person in light blue shirt and dark pants, brown hair"
rank = "prompt"
# Reports nothing when no person is more like the description, over "a person",
# than the cutoff learned from the verifier's answers
gate = true
# A no vetoes only near-identical crops: crops of different people are as
# alike as crops of one person, so lower would veto him for the others
learn_similarity = 0.95
confidence = 0.5
log_candidates = "mb/candidates.csv"
log_tiles = true

# WebP for the crops on the link
[[services]]
name = "webp_encoder"
type = "engine"
[services.plugin]
plugin = "webp_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
[services.plugin.args]
quality = 80

# Logs the box box_rerank reports on each frame it decides, and when
[[services]]
name = "detection_log"
type = "engine"
[services.plugin]
plugin = "detection-log"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-log@v4_backend_rework"
[services.plugin.args]
detector = "box_rerank"
images = false
csv = "mb/boxes.csv"
