# lambda (orchestrator): decodes box_rerank's crops and asks Qwen3-VL whether
# the person in the red box of each is the one in the reference photo

[daemon]
cert = ""
hostname = "lambda"
lcs = 9001
logs = 9002
metrics_port = 9393
port = 9000

[[services]]
name = "webp_decoder"
type = "engine"
[services.plugin]
plugin = "webp_decoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"

# Qwen3-VL 8B on Ollama, shown red_shirt.png and then each crop (enlarged to
# 224 px): "Is the object inside the red box this target?"
[[services]]
name = "verifier"
type = "engine"
[services.plugin]
plugin = "verifier"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
image = "red_shirt.png"
question = "box"
min_side = 224
log_tiles = true
