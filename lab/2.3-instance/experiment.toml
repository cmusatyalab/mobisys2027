# Finding one person (red_shirt.png, cropped from tunnel at 48 s) among
# others with box_rerank, its only description the reference photo: YOLO
# (COCO) finds the people on heisenberg, box_rerank picks the one like the
# photo, and lambda's Qwen3-VL verifier compares crops with it. Labels:
# labels/<video>.json (target "red shirt"); scored by scripts/score_tracking.py
# from mb/boxes.csv.

[[experiments]]
name = "tunnel_red_shirt"
vehicle = "drone"
[experiments.video]
video = "tunnel_720p.mp4"
flow = "flow.toml"
auto = true
warmup = 45  # box_rerank loads CLIP for ~30 s after it is listed as running
grace = 30  # for the queued crops to reach the verifier
[experiments.netsim]
profiles = ["intermittent"]
interface = "tailscale0"
port = 9001
trials = 1

[[experiments]]
name = "ric_back_red_shirt"
vehicle = "drone"
[experiments.video]
video = "ric_back_720p.mp4"
