# vehicle.rgb -> preprocess -> reachback (drift) ==network==> swiftmap (lambda2)

[[producers]]
name = "vehicle.rgb"

[[engines]]
name = "local.preprocess"
location = "local"

[[engines]]
name = "local.reachback"
location = "local"

[[engines]]
name = "remote.swiftmap"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.preprocess"
timeout = "2s"

[[edges]]
from = "local.preprocess"
to = "local.reachback"
timeout = "2s"

[[edges]]
from = "local.reachback"
to = "remote.swiftmap"
timeout = "5s"
