# vehicle.rgb -> encoder -> framestore (gs25456: stores every frame, dead end)
# framestore.keyframes, framestore.sendback ==network==> swiftmap (lambda2)
# One token on each framestore producer: Uriel sends the next only once the
# link has taken the last one

[[producers]]
name = "vehicle.rgb"

[[producers]]
name = "local.framestore.keyframes"
tokens = 1

[[producers]]
name = "local.framestore.sendback"
tokens = 1

[[engines]]
name = "local.encoder"
location = "local"

[[engines]]
name = "local.framestore"
location = "local"

[[engines]]
name = "remote.swiftmap"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.encoder"
timeout = "2s"

[[edges]]
from = "local.encoder"
to = "local.framestore"
timeout = "2s"

# Both edges to swiftmap: Uriel's deadline is 2 x timeout + 1 s = 31 s, past the
# slowest frame seen (~20 s for a q75 frame on intermittent), so a frame's token
# comes back only once it has crossed and frames never share the link
[[edges]]
from = "local.framestore.keyframes"
to = "remote.swiftmap"
timeout = "15s"

[[edges]]
from = "local.framestore.sendback"
to = "remote.swiftmap"
timeout = "15s"
