# vehicle.rgb -> preprocess -> reachback (drift: stores every frame, dead end)
# reachback.keyframes, reachback.sendback ==network==> swiftmap (lambda2)
# One token on each reachback producer: Uriel sends the next only once the
# link has taken the last one

[[producers]]
name = "vehicle.rgb"

[[producers]]
name = "local.reachback.keyframes"
tokens = 1

[[producers]]
name = "local.reachback.sendback"
tokens = 1

[[engines]]
name = "local.preprocess"
location = "local"

[[engines]]
name = "local.reachback"
location = "local"

[[engines]]
name = "remote.swiftmap"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.preprocess"
timeout = "2s"

[[edges]]
from = "local.preprocess"
to = "local.reachback"
timeout = "2s"

[[edges]]
from = "local.reachback.keyframes"
to = "remote.swiftmap"
timeout = "5s"

[[edges]]
from = "local.reachback.sendback"
to = "remote.swiftmap"
timeout = "5s"
