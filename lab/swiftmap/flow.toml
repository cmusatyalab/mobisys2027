# rgb -> jpeg_encoder -> reachback (fermi) ==network==> swiftmap (lambda2)

[[producers]]
name = "vehicle.rgb"

[[engines]]
name = "local.jpeg_encoder"
location = "local"

[[engines]]
name = "local.reachback"
location = "local"

[[engines]]
name = "remote.swiftmap"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.jpeg_encoder"
timeout = "2s"

[[edges]]
from = "local.jpeg_encoder"
to = "local.reachback"
timeout = "2s"

[[edges]]
from = "local.reachback"
to = "remote.swiftmap"
timeout = "5s"
