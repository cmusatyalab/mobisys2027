# fake_drone replays mill_19_front_115_240.mp4 (1:55-4:00 of mill_19_front.mp4, telemetry kept) on drift -> encoder -> framestore (drift)
# ==network==> swiftmap on gs25456. swiftmap's output folder is the result, and its
# engine log a catalog. drift has no prefix (no ssh), so its power draw is not measured.

[[experiments]]
name = "swiftmap"
vehicle = "100.107.26.73.drone" # drift
[experiments.video]
video = "mill_19_front_115_240.mp4"
flow = "flow.toml"
auto = true
# Caps, not fixed times: a trial ends once the first batch is mapped with its NFN
# round (the done hook). duration is the 125 s clip. grace lets the server's own
# round play out after the batch closes: reconstruct and plan ~30 s, reachback up
# to NFN_REACHBACK_TIMEOUT_S (120 s), remap ~50 s, plus margin
duration = 125
grace = 220
[experiments.netsim]
profiles = ["normal", "limited", "degraded", "intermittent", "outage"]
interface = "tailscale0"
port = 9001
trials = 1
failpoints = [[30, 30]]
# A fresh SwiftMap server each trial (setup); done ends the trial once a batch's
# NFN round is over; otherwise grace maps the open batch and waits for done;
# grace_end then finishes and stops the server before results are collected.
# end only stops a server a failed trial left running
[experiments.hooks]
setup = ["./swiftmap_server.sh", "start"]
done = ["./swiftmap_server.sh", "done"]
grace = ["./swiftmap_server.sh", "render"]
grace_end = ["sh", "-c", "./swiftmap_server.sh finish; ./swiftmap_server.sh stop"]
end = ["./swiftmap_server.sh", "stop"]

# Pushed from videos/ to every daemon once, before the first trial
[[uploads]]
file = "mill_19_front_115_240.mp4"
# Not on drift yet: pushed through the orchestrator before the first trial (476 MB).
# Once it is there, set no_upload = true to skip the push
no_upload = false

[daemons]
[daemons.gs25456]
orchestrator = true
prefix = ""
[daemons.drift] # the name drift's daemon registers with; no prefix

[results] # moved off the hosts after each trial
swiftmap = "gs25456/home/xianglic/Documents/swiftmap/output/"
[catalogs] # copied, the sources are kept
swiftmap_log = "gs25456/home/xianglic/.local/share/steeleagle/logs/*.swiftmap.log"
