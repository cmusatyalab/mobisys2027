# gs25456, intermittent profile only (the runner picks gs25456_swiftmap_intermittent.toml over gs25456.toml):
# replays the video, encodes each frame to the model input on board
# (lossy WebP q75), and the framestore sends keyframes and frames sent back to swiftmap

[daemon]
port = 9000
lcs = 9001
hostname = "gs25456"
orchestrator = "100.91.118.87:9000" # lambda2 over Tailscale, so netsim shapes the traffic

# Replays mill_19_front_115_240.mp4 (pushed to gs25456's files directory) once, from SetDataflow on
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
[services.plugin.args]
video = "mill_19_front_115_240.mp4"
no_loop = true
pad_after = true
telemetry = true

# VGGT-Omega's preprocessing on board: crop and bicubic-resize to the model input
# (688x384 for these frames) and send it as WebP. image_resolution and
# patch_size must match the server (VGGT_OMEGA_IMAGE_RESOLUTION, default 512)
[[services]]
name = "encoder"
type = "engine"
[services.plugin]
plugin = "encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/swiftmap@v4_backend_rework"
[services.plugin.args]
image_resolution = 512
patch_size = 16
# Lossy WebP q75 (~31 KB; ~35 dB at the model input): intermittent averages ~28 Kbps,
# so a frame takes ~10 s (up to ~20 s), inside the ~31 s framestore->swiftmap deadline
lossless = false
quality = 75

[[services]]
name = "framestore"
type = "engine"
[services.plugin]
plugin = "framestore"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/swiftmap@v4_backend_rework"
[services.plugin.args]
# 40 px at 1920 wide, scaled to the 688-wide frames the encoder sends
min_disparity = 14.0
