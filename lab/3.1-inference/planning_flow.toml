# The planning flow of 3.1's inference: flow.toml as a template, named by host
# rgb -> yolo (COCO), box_rerank, box_log (box_rerank's boxes), h264_encoder (fermi); h264_encoder ==network==> h264_rx -> inferred_mission (headless GCS) and h264_decoder -> detection (RF-DETR, lambda2); box_rerank.reintegration -> webp_encoder ==network==> rx_metrics -> webp_decoder -> verifier (lambda2)
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[[producers]]
name = "drone.rgb"
tokens = 1

[[producers]]
name = "fermi.box_rerank.reintegration"
tokens = 1

[[engines]]
name = "fermi.yolo"
location = "local"

[[engines]]
name = "fermi.box_rerank"
location = "local"

[[engines]]
name = "fermi.box_log"
location = "local"

[[engines]]
name = "fermi.h264_encoder"
location = "local"

[[engines]]
name = "lambda2.h264_rx"
location = "remote"

[[engines]]
name = "lambda2.inferred_mission"
location = "remote"

[[engines]]
name = "lambda2.h264_decoder"
location = "remote"

[[engines]]
name = "lambda2.detection"
location = "remote"

[[engines]]
name = "fermi.webp_encoder"
location = "local"

[[engines]]
name = "lambda2.rx_metrics"
location = "remote"

[[engines]]
name = "lambda2.webp_decoder"
location = "remote"

[[engines]]
name = "lambda2.verifier"
location = "remote"

[[edges]]
from = "drone.rgb"
to = "fermi.yolo"
timeout = "2s"

[[edges]]
from = "drone.rgb"
to = "fermi.box_rerank"
timeout = "2s"

[[edges]]
from = "drone.rgb"
to = "fermi.box_log"
timeout = "2s"

[[edges]]
from = "drone.rgb"
to = "fermi.h264_encoder"
timeout = "2s"

[[edges]]
from = "fermi.h264_encoder"
to = "lambda2.h264_rx"
timeout = "30s"

[[edges]]
from = "lambda2.h264_rx"
to = "lambda2.inferred_mission"
timeout = "30s"

[[edges]]
from = "lambda2.h264_rx"
to = "lambda2.h264_decoder"
timeout = "30s"

[[edges]]
from = "lambda2.h264_decoder"
to = "lambda2.detection"
timeout = "30s"

[[edges]]
from = "fermi.box_rerank.reintegration"
to = "fermi.webp_encoder"
timeout = "2s"

[[edges]]
from = "fermi.webp_encoder"
to = "lambda2.rx_metrics"
timeout = "30s"

[[edges]]
from = "lambda2.rx_metrics"
to = "lambda2.webp_decoder"
timeout = "30s"

[[edges]]
from = "lambda2.webp_decoder"
to = "lambda2.verifier"
timeout = "30s"
