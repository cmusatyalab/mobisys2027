# fermi for 3.1 headless GCS mission inference, with cliped tracking (box_rerank), outage: person_track_1
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays person_track_1.mp4 once, then black frames until stopped; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "person_track_1.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"
pad_after = true

# YOLO26 on the HTP (detection-qnn, COCO): every frame forwarded
[[services]]
name = "yolo"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"
[services.plugin.args]
model = "libs640x384_v26_quant.so"
only_classes = ["person"]
confidence = 0.25
nms_score_threshold = 0.25

# Picks the tracked person among yolo's boxes; starts on "moving" and follows the verifier's prompt heartbeat (ignore_new off), so the prompt inference writes; logs every candidate
[[services]]
name = "box_rerank"
type = "engine"
[services.plugin]
plugin = "box_rerank"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
detector = "yolo"
verifier = "verifier"
class = "person"
prompt = "moving"
rank = "prompt"
confidence = 0.5
gate = false
ignore_new = false
log_candidates = "mb/candidates.csv"
max_queue = 512

# Logs the box box_rerank reports on each frame; no images
[[services]]
name = "box_log"
type = "engine"
[services.plugin]
plugin = "detection-log"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-log@v4_backend_rework"
[services.plugin.args]
detector = "box_rerank"
images = false
csv = "mb/boxes.csv"

# The Tachyon's hardware H.264 encoder at 1.5 Mbps (VBR), under outage's 2-3 Mbps
[[services]]
name = "h264_encoder"
type = "engine"
[services.plugin]
plugin = "encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/h264@v4_backend_rework"
environment = "native"
[services.plugin.args]
decoder_name = "h264_decoder"
converter = "qtivtransform ! video/x-raw(memory:GBM),format=NV12"
encoder = "qtic2venc control-rate=VBR-CFR target-bitrate=1500000 b-frames=0 idr-interval=30"

# WebP at quality 65
[[services]]
name = "webp_encoder"
type = "engine"
[services.plugin]
plugin = "webp_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
[services.plugin.args]
quality = 65
