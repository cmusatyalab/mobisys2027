# 3.1 headless GCS mission inference, with cliped tracking (box_rerank), outage
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.
# fermi_<experiment>.toml is each experiment's fermi config; lambda2.toml is shared.

[[experiments]]
# scored: a person counts as found
name = "person_track_1"
vehicle = "drone"
[experiments.video]
video = "person_track_1.mp4"
flow = "flow.toml"
auto = true
warmup = 30  # for CLIP to load before the first frame
grace = 60  # for reintegration to finish
[experiments.netsim]
profiles = ["outage"]
interface = "tailscale0"
port = 9001
trials = 1
failpoints = [[51.9, 168.1]]  # 5 s after the inferred prompt reaches box_rerank (the hoodie appears at 31.2 s, +15.7 s) to the video's end
[experiments.hooks]
end = ["sh", "-c", "d=/root/.local/share/steeleagle/files/verifier_live; mkdir -p \"$d\"; for p in \"$d\"/prompt.txt \"$d\"/prompt.jpg \"$d\"/prompt.jpeg \"$d\"/description.txt \"$d\"/class.txt \"$d\"/d*.jpg; do [ -e \"$p\" ] && mv \"$p\" \"$EXPERIMENT_TRIAL_DIR/verifier_${p##*/}\"; done; rm -f \"$d\"/replaced-*; true"]

# Pushed to every daemon once, before the first experiment
[[uploads]]
file = "planning_flow.toml"
push_as = "inference_flow.toml"
[[uploads]] # already in fermi's files directory (videos/ has a copy for its length)
file = "person_track_1.mp4"
no_upload = true

[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.fermi]
prefix = "root@fermi:"

[results] # moved off the hosts after each trial
fermi = "fermi/root/.local/share/steeleagle/files/mb/"
lambda2 = "lambda2/root/.local/share/steeleagle/files/mb/"
# The inference's runs: each section's record, frames and target.png
inference = "lambda2/root/.local/share/steeleagle/files/inferred_mission_headless/"
[catalogs] # copied off the hosts after each trial
# The verifier's crops in (in/) and the ones it said yes to (out/)
verifier = "lambda2/root/.local/share/steeleagle/files/*.verifier"
