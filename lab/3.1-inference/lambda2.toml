# lambda2 (orchestrator) for 3.1 headless GCS mission inference, with cliped tracking (box_rerank), outage
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "lambda2"

# Logs each frame as it arrives from fermi, before it is decoded, and passes it on
[[services]]
name = "h264_rx"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/h264.csv"
forward_frames = true

# The headless GCS mission inference: 5 s sections at 1 fps, with RF-DETR's boxes; on Track, checks the tracked box against the verifier's prompt and, if it isn't it, writes a crop of it to the verifier's live prompt (prompt.jpg). No deploy: the fake drone can't fly
[[services]]
name = "inferred_mission"
type = "engine"
[services.plugin]
plugin = "inferred_mission_headless"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/gcs@v4_backend_rework"
[services.plugin.args]
vehicle = "drone"
camera = "rgb"
flow = "inference_flow.toml"
detector = "detection"
local_detector = "fermi.box_rerank"
verifier = "qwen3-vl:30b-a3b-instruct"
verifier_live_dir = "/root/.local/share/steeleagle/files/verifier_live"
auto_deploy = false
[services.plugin.args.ai]
[services.plugin.args.ai.inferred_mission]
section_seconds = 5.0

[[services]]
name = "h264_decoder"
type = "engine"
[services.plugin]
plugin = "decoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/h264@v4_backend_rework"

# RF-DETR 2XLarge on lambda2's GPU (torch for CUDA 12.6)
[[services]]
name = "detection"
type = "engine"
[services.plugin]
plugin = "detection"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection@v4_backend_rework"
environment = "cuda126"
[services.plugin.args]
model = "rfdetr"
rfdetr_size = "2xlarge"

# Logs each frame as it arrives from fermi, before it is decoded, and passes it on
[[services]]
name = "rx_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/rx.csv"
forward_frames = true

[[services]]
name = "webp_decoder"
type = "engine"
[services.plugin]
plugin = "webp_decoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"

# The VLM (Qwen3-VL 30B, Ollama) that answers box_rerank's crops; its prompt follows verifier_live/prompt.jpg, the GCS's crop of the tracked box, which it describes by the colors and features that set it apart from the distractors the GCS writes beside it (d<N>.jpg; image_mode contrastive), not just its kind; the end hook moves them into the trial directory
[[services]]
name = "verifier"
type = "engine"
[services.plugin]
plugin = "verifier"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
prompt = "moving"
question = "box"
min_side = 224
live = "verifier_live"
log_tiles = true
image_mode = "contrastive"
