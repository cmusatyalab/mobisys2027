# 2.1.2 change detection: PatchCore, reintegration, H.264
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.
# fermi_<experiment>.toml is each experiment's fermi config; lambda2.toml is shared.

[[experiments]]
# scored: a mannequin or person counts as found
name = "field"
vehicle = "drone"
[experiments.video]
video = "field.mp4"
flow = "flow.toml"
auto = true
[experiments.netsim]
profiles = ["normal", "limited", "degraded"]
interface = "tailscale0"
port = 9001
trials = 3

[[experiments]]
# scored: a mannequin or person counts as found
name = "field_lossy"
vehicle = "drone"
[experiments.video]
video = "field.mp4"
flow = "flow.toml"
auto = true
grace = 60  # for reintegration to finish
[experiments.netsim]
profiles = ["intermittent", "malicious"]
interface = "tailscale0"
port = 9001
trials = 3
failpoints = [[244.2, 4.3], [459.4, 4.0], [690.5, 3.9]]  # while the mannequin is in view, padded 1 s

# Pushed to every daemon once, before the first experiment
[[uploads]] # already in fermi's files directory (videos/ has a copy for its length)
file = "field.mp4"
no_upload = true

[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.fermi]
prefix = "root@fermi:"

[results] # moved off the hosts after each trial
fermi = "fermi/root/.local/share/steeleagle/files/mb/"
lambda2 = "lambda2/root/.local/share/steeleagle/files/mb/"
