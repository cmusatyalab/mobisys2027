# fermi for 2.1.2 change detection: PatchCore, reintegration, H.264: field_lossy
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays field.mp4 once, then black frames until stopped; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "field.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"
pad_after = true

# patchcore takes 1280x720 frames
[[services]]
name = "rescale"
type = "engine"
[services.plugin]
plugin = "rescale"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/rescale@v4_backend_rework"
[services.plugin.args]
resolution = "720p"

# PatchCore's backbone on the HTP
[[services]]
name = "embed"
type = "engine"
[services.plugin]
plugin = "embed"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/patchcore-embed@v4_backend_rework"

# Forwards anomalous frames, queued until h264_decoder has them; logs each one
[[services]]
name = "score"
type = "engine"
[services.plugin]
plugin = "score"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/patchcore-score@v4_backend_rework"
[services.plugin.args]
threshold_meta = "models/gravel_meta.pt"
faiss_index = "models/gravel.faiss"
verifier = "h264_decoder"
log_sent = "mb/sent.csv"

# The Tachyon's hardware H.264 encoder, as in live/
[[services]]
name = "h264_encoder"
type = "engine"
[services.plugin]
plugin = "encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/h264@v4_backend_rework"
environment = "native"
[services.plugin.args]
decoder_name = "h264_decoder"
converter = "qtivtransform ! video/x-raw(memory:GBM),format=NV12"
encoder = "qtic2venc control-rate=disable b-frames=0 idr-interval=30"
