# fermi for 2.1.3.2 cliped, text prompt "person", learning: street
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays street.mp4 once; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "street.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"

# cliped's tiling is tuned for 720p
[[services]]
name = "rescale"
type = "engine"
[services.plugin]
plugin = "rescale"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/rescale@v4_backend_rework"
[services.plugin.args]
resolution = "720p"

# CLIP edge filter, learning on; a tile is queued until the verifier answers it; logs each frame scored and each tile queued
[[services]]
name = "cliped"
type = "engine"
[services.plugin]
plugin = "cliped"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
prompt = "person"
verifier = "verifier"
learn = true
log_sent = "mb/sent.csv"
log_scored = "mb/scored.csv"
max_queue = 512

# WebP at quality 65
[[services]]
name = "webp_encoder"
type = "engine"
[services.plugin]
plugin = "webp_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
[services.plugin.args]
quality = 65
