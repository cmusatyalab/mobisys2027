# 2.1.3.1 cliped, text prompt "person", no learning
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.
# fermi_<experiment>.toml is each experiment's fermi config; lambda2.toml is shared.

[[experiments]]
# scored: a mannequin or person counts as found
name = "parkinglot"
vehicle = "drone"
[experiments.video]
video = "parkinglot.mp4"
flow = "flow.toml"
auto = true
[experiments.netsim]
profiles = ["normal", "limited", "degraded"]
interface = "tailscale0"
port = 9001
trials = 3

[[experiments]]
# scored: a mannequin or person counts as found
name = "parkinglot_lossy"
vehicle = "drone"
[experiments.video]
video = "parkinglot.mp4"
flow = "flow.toml"
auto = true
grace = 8.6  # 10% of the run, for reintegration to finish
[experiments.netsim]
profiles = ["intermittent", "malicious"]
interface = "tailscale0"
port = 9001
trials = 3
failpoints = [[49.0, 16.3]]  # while the mannequin is in view, padded 1 s

