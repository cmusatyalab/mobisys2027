# lambda2 (orchestrator) for 2.1.3.7 cliped, image prompt dog.jpg, learning, MMLA
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "lambda2"

# Logs each frame as it arrives from fermi, before it is decoded, and passes it on
[[services]]
name = "rx_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/rx.csv"
forward_frames = true

[[services]]
name = "webp_decoder"
type = "engine"
[services.plugin]
plugin = "webp_decoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"

# The VLM (Ollama) that answers each tile, which cliped learns from
[[services]]
name = "verifier"
type = "engine"
[services.plugin]
plugin = "verifier"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
image = "dog.jpg"
question = "Image 1 is a reference photo of an animal, taken from the ground. Image 2 is a low-resolution tile cut from an aerial drone photo, seen from far above. Animals in the tile are small and will never look exactly like the reference, so judge whether any animal in image 2 is the same kind of animal as image 1, not the same individual. Other kinds of animals may appear, and many tiles have no animal at all. Answer with only yes or no."

# Logs each frame reaching the end of the pipeline
[[services]]
name = "sink_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/sink.csv"
