# fermi for 2.1.3.4 cliped, image prompt mannequin.jpeg, learning: traintrack_lossy
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays traintrack.mp4 once, then black frames until stopped; logs each frame
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
[services.plugin.args]
video = "traintrack.mp4"
no_loop = true
frame_log = "mb/frames.csv"
pad_after = true

# cliped's tiling is tuned for 720p
[[services]]
name = "rescale"
type = "engine"
[services.plugin]
plugin = "rescale"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/rescale@v4_backend_rework"
[services.plugin.args]
resolution = "720p"

# CLIP edge filter, learning on; resend_after_ms is above the 5 s edge timeout plus the VLM's time per tile; logs each tile queued
[[services]]
name = "cliped"
type = "engine"
[services.plugin]
plugin = "cliped"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
image = "mannequin.jpeg"
verifier = "verifier"
learn = true
resend_after_ms = 15000
log_sent = "mb/sent.csv"

# WebP at quality 65
[[services]]
name = "webp_encoder"
type = "engine"
[services.plugin]
plugin = "webp_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
[services.plugin.args]
quality = 65
