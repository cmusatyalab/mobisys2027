# 2.1.3.6 cliped, text prompt "African wild dog", no learning, MMLA
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.
# fermi_<experiment>.toml is each experiment's fermi config; lambda2.toml is shared.

[[experiments]]
# scored: a dog counts as found
name = "mmla"
vehicle = "drone"
[experiments.video]
video = "mmla"
flow = "flow.toml"
auto = true
duration = 400.0  # 4000 frames at 10 fps
[experiments.netsim]
profiles = ["normal", "limited", "degraded"]
interface = "tailscale0"
port = 9001
trials = 3

[[experiments]]
# scored: a dog counts as found
name = "mmla_lossy"
vehicle = "drone"
[experiments.video]
video = "mmla"
flow = "flow.toml"
auto = true
duration = 400.0  # 4000 frames at 10 fps
grace = 60  # for reintegration to finish
[experiments.netsim]
profiles = ["intermittent"]
interface = "tailscale0"
port = 9001
trials = 3

# Pushed to every daemon once, before the first experiment
[[uploads]] # a directory of images already in fermi's files directory (scripts/prepare_datasets.py)
file = "mmla"
no_upload = true

[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.fermi]
prefix = "root@fermi:"

[results] # moved off the hosts after each trial
fermi = "fermi/root/.local/share/steeleagle/files/mb/"
lambda2 = "lambda2/root/.local/share/steeleagle/files/mb/"
