# 2.1.3.9 cliped, text prompt "person", learning, S&R flight (heisenberg, lambda)
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.
# heisenberg_<experiment>.toml is each experiment's heisenberg config; lambda.toml is shared.

[[experiments]]
# scored: a mannequin or person counts as found
name = "sandr_test"
vehicle = "drone"
[experiments.video]
video = "sandr_test.mp4"
flow = "flow.toml"
auto = true
warmup = 30  # for CLIP to load before the first frame
[experiments.netsim]
profiles = ["normal", "limited", "degraded"]
interface = "tailscale0"
port = 9001
trials = 3

[[experiments]]
# scored: a mannequin or person counts as found
name = "sandr_test_lossy"
vehicle = "drone"
[experiments.video]
video = "sandr_test.mp4"
flow = "flow.toml"
auto = true
warmup = 30  # for CLIP to load before the first frame
grace = 60  # for reintegration to finish
[experiments.netsim]
profiles = ["intermittent"]
interface = "tailscale0"
port = 9001
trials = 3

# Pushed to every daemon once, before the first experiment
[[uploads]] # already in heisenberg's files directory (videos/ has a copy for its length)
file = "sandr_test.mp4"
no_upload = true

[daemons]
[daemons.lambda]
orchestrator = true
prefix = ""
[daemons.heisenberg]
prefix = "root@heisenberg:"

[results] # moved off the hosts after each trial
heisenberg = "heisenberg/root/.local/share/steeleagle/files/mb/"
lambda = "lambda/root/.local/share/steeleagle/files/mb/"
