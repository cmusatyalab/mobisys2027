# lambda2 (orchestrator) for 2.1.1.1 YOLO early discard (person, conf 0.5), H.264 at 480p on normal, 240p on the rest
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "lambda2"

# Logs each frame as it arrives from fermi, before it is decoded, and passes it on
[[services]]
name = "rx_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/rx.csv"
forward_frames = true

[[services]]
name = "h264_decoder"
type = "engine"
[services.plugin]
plugin = "decoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/h264@v4_backend_rework"
