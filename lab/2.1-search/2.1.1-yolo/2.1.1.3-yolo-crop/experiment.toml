# Pushed to every daemon once, before the first experiment
[[uploads]] # already in fermi's files directory (videos/ has a copy for its length)
file = "parkinglot.mp4"
no_upload = true
[[uploads]] # already in fermi's files directory (videos/ has a copy for its length)
file = "traintrack.mp4"
no_upload = true
[[uploads]] # already in fermi's files directory (videos/ has a copy for its length)
file = "street.mp4"
no_upload = true
[[uploads]] # a directory of images already in fermi's files directory (see lab/README.md)
file = "wisard"
no_upload = true
[[uploads]] # a directory of images already in fermi's files directory (see lab/README.md)
file = "sard"
no_upload = true

[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.fermi]
prefix = "root@fermi:"

[results] # moved off the hosts after each trial
fermi = "fermi/root/.local/share/steeleagle/files/mb/"
lambda2 = "lambda2/root/.local/share/steeleagle/files/mb/"
