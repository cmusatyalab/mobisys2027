# fermi for 2.1.1.3 YOLO early discard + crop to the best person, WebP: parkinglot
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays parkinglot.mp4 once; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "parkinglot.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"

# YOLO26 on the HTP (detection-qnn, COCO): early discard of frames with no person
[[services]]
name = "yolo"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"
[services.plugin.args]
only_classes = ["person"]
early_discard = true
confidence = 0.5
nms_score_threshold = 0.5

# Logs each frame yolo processed (frame_id, timestamp_ns, seq, its boxes), for effective recall
[[services]]
name = "yolo_log"
type = "engine"
[services.plugin]
plugin = "detection-log"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-log@v4_backend_rework"
[services.plugin.args]
detector = "yolo"
images = false
csv = "mb/scored.csv"

# Crops each frame to yolo's best person; queued until webp_decoder has the crop; logs each crop
[[services]]
name = "reduce"
type = "engine"
[services.plugin]
plugin = "detection-crop"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-crop@v4_backend_rework"
[services.plugin.args]
detector = "yolo"
class = "person"
verifier = "webp_decoder"
log_sent = "mb/sent.csv"
max_queue = 512

# WebP at quality 65
[[services]]
name = "webp_encoder"
type = "engine"
[services.plugin]
plugin = "webp_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
[services.plugin.args]
quality = 65
