# lambda2 (orchestrator) for 2.1.1.5 YOLO early discard + crop + reintegration, verified by RF-DETR 2XL (conf 0.85)
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "lambda2"

# Logs each frame as it arrives from fermi, before it is decoded, and passes it on
[[services]]
name = "rx_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/rx.csv"
forward_frames = true

[[services]]
name = "webp_decoder"
type = "engine"
[services.plugin]
plugin = "webp_decoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"

# RF-DETR 2XLarge on lambda2's GPU (torch for CUDA 12.6)
[[services]]
name = "verifier"
type = "engine"
[services.plugin]
plugin = "detection"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection@v4_backend_rework"
environment = "cuda126"
[services.plugin.args]
model = "rfdetr"
rfdetr_size = "2xlarge"
only_classes = ["person"]
confidence = 0.85
letterbox = true
early_discard = true

# Logs each frame reaching the end of the pipeline
[[services]]
name = "sink_metrics"
type = "engine"
[services.plugin]
plugin = "metrics"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
[services.plugin.args]
csv_path = "mb/sink.csv"
