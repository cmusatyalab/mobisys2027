# fermi for 2.1.1.2 YOLO early discard recall curve: confidence 0.01, 0.1 ... 1.0, unshaped link: parkinglot_c080
# Generated by `uv run lab` (src/mobisys2027/lab.py); edit that instead.

[daemon]
port = 9000
lcs = 9001
hostname = "fermi"
orchestrator = "lambda2:9000"

# Replays parkinglot.mp4 once; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "parkinglot.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"

# YOLO26 on the HTP (detection-qnn, COCO): early discard of frames with no person
[[services]]
name = "yolo"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"
[services.plugin.args]
only_classes = ["person"]
early_discard = true
confidence = 0.8
nms_score_threshold = 0.8

# Logs each frame yolo processed (frame_id, timestamp_ns, seq, its boxes), for effective recall
[[services]]
name = "yolo_log"
type = "engine"
[services.plugin]
plugin = "detection-log"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-log@v4_backend_rework"
[services.plugin.args]
detector = "yolo"
images = false
csv = "mb/scored.csv"

# The Tachyon's hardware H.264 encoder, as in live/
[[services]]
name = "h264_encoder"
type = "engine"
[services.plugin]
plugin = "encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/h264@v4_backend_rework"
environment = "native"
[services.plugin.args]
decoder_name = "h264_decoder"
converter = "qtivtransform ! video/x-raw(memory:GBM),format=NV12"
encoder = "qtic2venc control-rate=disable b-frames=0 idr-interval=30"
