# rgb -> rescale (720p) -> cliped -> webp_encoder ==network==> webp_decoder -> verifier (lambda2)

[[producers]]
name = "vehicle.rgb"

[[engines]]
name = "local.rescale"
location = "local"

[[engines]]
name = "local.cliped"
location = "local"

[[engines]]
name = "local.webp_encoder"
location = "local"

[[engines]]
name = "remote.webp_decoder"
location = "remote"

[[engines]]
name = "remote.verifier"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.rescale"
timeout = "2s"

[[edges]]
from = "local.rescale"
to = "local.cliped"
timeout = "2s"

[[edges]]
from = "local.cliped"
to = "local.webp_encoder"
timeout = "2s"

[[edges]]
from = "local.webp_encoder"
to = "remote.webp_decoder"
timeout = "5s"

[[edges]]
from = "remote.webp_decoder"
to = "remote.verifier"
timeout = "5s"
