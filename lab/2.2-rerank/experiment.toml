# Tracking the robot dog in the beagle run (beagle_tracking_720p.mp4, already
# in heisenberg's files directory), three ways, under each network profile:
#
# - rerank_beagle: YOLO on heisenberg's HTP, and box_rerank picking among its
#   boxes (by confidence), the crops going to lambda's Qwen3-VL verifier;
# - rerank_prompt_beagle: the same, box_rerank ranking its boxes by the prompt;
# - yolo_beagle: onboard only, YOLO alone;
# - rfdetr_beagle: offboard only, H.264 to lambda's RF-DETR.
#
# Each logs the box it reports on every frame it decides, with when, in
# mb/boxes.csv (detection_log); scored by scripts/score_tracking.py.

[[experiments]]
name = "rerank_beagle"
vehicle = "drone"
[experiments.video]
video = "beagle_tracking_720p.mp4"
flow = "flow.toml"
auto = true
warmup = 30  # box_rerank loads CLIP for ~20 s after it is listed as running
duration = 63  # the clip is 62.03 s; set here as videos/ has no copy of it
grace = 30  # for the queued crops to reach the verifier
[experiments.netsim]
profiles = ["normal", "limited", "degraded", "intermittent"]
interface = "tailscale0"
port = 9001
trials = 1

[[experiments]]
name = "rerank_prompt_beagle"  # as rerank_beagle, box_rerank ranking by the prompt
vehicle = "drone"
[experiments.video]
video = "beagle_tracking_720p.mp4"
flow = "flow.toml"
auto = true
warmup = 30
duration = 63
grace = 30
[experiments.netsim]
profiles = ["normal", "limited", "degraded", "intermittent"]
interface = "tailscale0"
port = 9001
trials = 1

[[experiments]]
name = "yolo_beagle"
vehicle = "drone"
[experiments.video]
video = "beagle_tracking_720p.mp4"
flow = "flow_yolo.toml"
auto = true
duration = 63
grace = 5
[experiments.netsim]
profiles = ["normal", "limited", "degraded", "intermittent"]
interface = "tailscale0"
port = 9001
trials = 1

[[experiments]]
name = "rfdetr_beagle"
vehicle = "drone"
[experiments.video]
video = "beagle_tracking_720p.mp4"
flow = "flow_rfdetr.toml"
auto = true
warmup = 30  # for RF-DETR to load onto the GPU
duration = 63
grace = 10  # for frames still crossing to finish
[experiments.netsim]
profiles = ["normal", "limited", "degraded", "intermittent"]
interface = "tailscale0"
port = 9001
trials = 1

# Already in heisenberg's files directory
[[uploads]]
file = "beagle_tracking_720p.mp4"
no_upload = true

[daemons]
[daemons.lambda]
orchestrator = true
prefix = ""
[daemons.heisenberg]
prefix = "root@heisenberg:"

[results] # moved off the hosts after each trial
heisenberg = "heisenberg/root/.local/share/steeleagle/files/mb/"
lambda = "lambda/root/.local/share/steeleagle/files/mb/"  # rfdetr_beagle's boxes
[catalogs] # copied, the sources are kept
box_rerank_log = "heisenberg/root/.local/share/steeleagle/logs/*box_rerank.log"
verifier_log = "lambda/root/.local/share/steeleagle/logs/*verifier.log"
