# Onboard only: rgb -> detection_qnn (YOLO), with detection_log logging its
# boxes; nothing crosses the network

[[producers]]
name = "vehicle.rgb"
tokens = 1

[[engines]]
name = "local.detection_qnn"
location = "local"

[[engines]]
name = "local.detection_log"
location = "local"

[[edges]]
from = "vehicle.rgb"
to = "local.detection_qnn"
timeout = "2s"

[[edges]]
from = "vehicle.rgb"
to = "local.detection_log"
timeout = "2s"
