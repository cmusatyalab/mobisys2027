# heisenberg (Tachyon): replays the beagle robot dog run, YOLO on the HTP, and
# box_rerank, which sends its crops to lambda's verifier

[daemon]
cert = ""
hostname = "heisenberg"
lcs = 9001
logs = 9002
metrics_port = 9393
orchestrator = "lambda:9000"
port = 9000

# Replays beagle_tracking_720p.mp4 (16:59-18:01 of beagle_tracking.mp4, one
# onboard-only tracking run, at 720p) once; logs each frame; hardware decoder
[[services]]
name = "drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
environment = "native"
[services.plugin.args]
video = "beagle_tracking_720p.mp4"
decoder = "qtic2vdec"
no_loop = true
frame_log = "mb/frames.csv"

# The onboard tracking model, at a lower confidence than the 0.5 it tracks
# with, so box_rerank sees the boxes YOLO is unsure of too
[[services]]
name = "detection_qnn"
type = "engine"
[services.plugin]
plugin = "detection-qnn"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-qnn@v4_backend_rework"
[services.plugin.args]
backend = "/home/particle/cpp_server_build/libs/libQnnHtp.so"
labels = "dog_extended.txt"
model = "libdog_extended_s640_v26_dogcalib_quant.so"
confidence = 0.25
nms_score_threshold = 0.25

# Reports at most one "robotic dog" a frame: never a box like one the
# verifier said no to twice, first one like a confirmed yes, else YOLO's best
# from 0.5. Logs every candidate of every frame, and each crop sent
[[services]]
name = "box_rerank"
type = "engine"
[services.plugin]
plugin = "box_rerank"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
[services.plugin.args]
detector = "detection_qnn"
verifier = "verifier"
class = "robotic dog"
prompt = "a quadruped robot dog"
# Ranked by confidence, as this experiment first ran (box_rerank's default
# was then "confidence"); rerank_prompt_beagle ranks by the prompt
rank = "confidence"
confidence = 0.5
log_candidates = "mb/candidates.csv"
log_tiles = true

# WebP for the crops on the link
[[services]]
name = "webp_encoder"
type = "engine"
[services.plugin]
plugin = "webp_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
[services.plugin.args]
quality = 80

# Logs the box box_rerank reports on each frame it decides, and when, for
# precision, recall, throughput and latency; no images, so it costs the frame
# path nothing
[[services]]
name = "detection_log"
type = "engine"
[services.plugin]
plugin = "detection-log"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/detection-log@v4_backend_rework"
[services.plugin.args]
detector = "box_rerank"
images = false
csv = "mb/boxes.csv"
