[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.fermi] # the name fermi's daemon registers with
prefix = "root@fermi:"

[results] # moved off the hosts after each trial
detection_log = "fermi/root/.local/share/steeleagle/files/*.detection_log/"
