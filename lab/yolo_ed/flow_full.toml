# rgb -> yolo (early discard) -> detection_log
#                             -> jpeg_encoder (whole frames) ==network==> jpeg_decoder (lambda2)

[[producers]]
name = "vehicle.rgb"

[[engines]]
name = "local.yolo"
location = "local"

[[engines]]
name = "local.detection_log"
location = "local"

[[engines]]
name = "local.jpeg_encoder"
location = "local"

[[engines]]
name = "remote.jpeg_decoder"
location = "remote"

[[edges]]
from = "vehicle.rgb"
to = "local.yolo"
timeout = "2s"

[[edges]]
from = "local.yolo"
to = "local.detection_log"
timeout = "2s"

[[edges]]
from = "local.yolo"
to = "local.jpeg_encoder"
timeout = "2s"

[[edges]]
from = "local.jpeg_encoder"
to = "remote.jpeg_decoder"
timeout = "5s"
