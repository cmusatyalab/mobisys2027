[[producers]]
name = "vehicle.telemetry"
tokens = 1
[[producers]]
name = "vehicle.rgb"
tokens = 1

[[engines]]
name = "remote.gcs"
location = "remote"
[[engines]]
name = "local.detection_qnn"
location = "local"
[[engines]]
name = "local.detection_log"
location = "local"

[[edges]]
from = "vehicle.telemetry"
to = "remote.gcs"
timeout = "1s"
[[edges]]
from = "vehicle.rgb"
to = "local.detection_qnn"
timeout = "1s"
[[edges]]
from = "local.detection_qnn"
to = "local.detection_log"
timeout = "1s"
