# lambda (orchestrator): the GCS (telemetry only), and the verifier
# box_rerank's crops go to

[daemon]
  cert = ""
  hostname = "lambda"
  lcs = 9001
  logs = 9002
  metrics_port = 9393
  port = 9000

[[services]]
  auth = "admin"
  name = "gcs"
  type = "engine"
  [services.plugin]
    package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/gcs@v4_backend_rework"
    plugin = "gcs"
    [services.plugin.args]
      dump_dir = "/root/.local/share/steeleagle/files/gcs_frames"
      http_addr = ":8002"

# Logs each crop as it arrives from heisenberg, before it is decoded, and
# passes it on: its size and send/receive timestamps (mb/rx.csv), for the
# bytes actually sent, which no profile measures otherwise (ambient runs no
# netsim)
[[services]]
  name = "rx_metrics"
  type = "engine"
  [services.plugin]
    package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/metrics@v4_backend_rework"
    plugin = "metrics"
    [services.plugin.args]
      csv_path = "mb/rx.csv"
      forward_frames = true

[[services]]
  name = "webp_decoder"
  type = "engine"
  [services.plugin]
    package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"
    plugin = "webp_decoder"

[[services]]
  name = "verifier"
  type = "engine"
  [services.plugin]
    package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/cliped@v4_backend_rework"
    plugin = "verifier"
    [services.plugin.args]
      log_tiles = true
      min_side = 224
      image = "robodog.webp"
      image_mode = "description"
      question = "box"

[simulator]
  package = "https://github.com/cmusatyalab/steeleagle_plugins//simulator@v4_backend_rework"

