# Live mission inference with cliped tracking: the pilot flies the ANAFI by
# hand from the GCS on lambda2 while its live inference (Inferred Mission
# tab, 5 s sections, planning with the GCS's default flow, the trial's
# flow.toml) works out who is being tracked, rewrites the verifier's prompt to them, and deploys its inferred
# mission (auto_deploy), which the drone starts when its data link drops. The runner only sets the flow (on
# ENTER, as the lab experiments do) and cuts the link from 60 s to the 120 s
# end; no mission is loaded by the runner.
[[experiments]]
name = "inference_track"
vehicle = "steppeeagle"
[experiments.video]
# A placeholder: the [experiments.video] phase sets the flow, and only a fake
# drone plays a video; the ANAFI streams its own camera
video = "anafi_live.mp4"
flow = "flow.toml"
# Started on ENTER, once the pilot is flying and live inference is running
auto = false
duration = 120
# box_rerank loads CLIP for ~20 s after it is listed as running
warmup = 20
[experiments.netsim]
profiles = ["outage"]
interface = "tailscale0"
port = 9001
trials = 1
# From 60 s after the flow is set to the end
failpoints = [[60, 60]]
[experiments.hooks]
# The verifier's last prompt into the trial: the crop of the tracked box the
# GCS wrote (prompt.jpg, which the verifier describes; its text is in the
# verifier's log), and any text prompt; cleared, so the next trial starts
# from the args
end = ["sh", "-c", "d=/root/.local/share/steeleagle/files/verifier_live; mkdir -p \"$d\"; for f in prompt.txt prompt.jpg prompt.jpeg; do [ -e \"$d/$f\" ] && mv \"$d/$f\" \"$EXPERIMENT_TRIAL_DIR/verifier_$f\"; done; rm -f \"$d\"/replaced-*; true"]

[[uploads]] # the GCS's default flow, which live inference plans with: the trial's flow
file = "flow.toml"
push_as = "planning_flow.toml"
[[uploads]] # the placeholder video: nothing is pushed
file = "anafi_live.mp4"
no_upload = true

[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.heisenberg]
prefix = "root@heisenberg:"

[results] # moved off the hosts after each trial
heisenberg = "heisenberg/root/.local/share/steeleagle/files/mb/"
lambda2 = "lambda2/root/.local/share/steeleagle/files/mb/"
# The GCS's recording of the drone's H.264 stream
gcs = "lambda2/root/.local/share/steeleagle/files/gcs_frames/"
# Live inference's runs: each section's frames, answer and mission
inference = "lambda2/root/.local/share/steeleagle/files/inferred_mission/"
[catalogs] # copied off the hosts after each trial
# The verifier's crops in (in/) and the ones it said yes to (out/)
verifier = "lambda2/root/.local/share/steeleagle/files/*.verifier"
box_rerank_log = "heisenberg/root/.local/share/steeleagle/logs/*box_rerank.log"
verifier_log = "lambda2/root/.local/share/steeleagle/logs/*verifier.log"
# Each trial's logs (a daemon restart starts them over, so they are copied
# before the next trial's). The drone's daemon: flows set, missions compiled
# and loaded, failsafe state changes and behaviors; its vehicle: the driver
# and the mission it runs (Track, target lost, return home)
heisenberg_log = "heisenberg/root/.local/share/steeleagle/logs/heisenberg.log"
vehicle_log = "heisenberg/root/.local/share/steeleagle/logs/*.steppeeagle.log"
# The drone's engines: the encoder whose stream crosses the link, YOLO's boxes
encoder_log = "heisenberg/root/.local/share/steeleagle/logs/*.encoder.log"
yolo_log = "heisenberg/root/.local/share/steeleagle/logs/*.yolo.log"
# lambda2's daemon (registrations, deployed missions' RPCs) and the GCS: live
# inference's sections (its answer, mission, compile and deploy), the
# frames it got, and the default flow
lambda2_log = "lambda2/root/.local/share/steeleagle/logs/lambda2.log"
gcs_log = "lambda2/root/.local/share/steeleagle/logs/*.gcs.log"
# The stream on lambda2: the decoder (the one engine reading the drone's
# encoder), the re-encoder for the GCS, and RF-DETR, whose boxes inference
# sees
decoder_log = "lambda2/root/.local/share/steeleagle/logs/*.decoder.log"
reencoder_log = "lambda2/root/.local/share/steeleagle/logs/*.reencoder.log"
detection_log = "lambda2/root/.local/share/steeleagle/logs/*.detection.log"
