# drift: replays mill_19_front.mp4 and sends its keyframes to lambda2

[daemon]
port = 9000
lcs = 9001
hostname = "drift"
orchestrator = "lambda2:9000"

# Replays mill_19_front.mp4 (already in drift's files directory) once, from
# SetDataflow on, with the GPS fix recorded with each frame, which
# keyframe_filter's send_distance needs
[[services]]
name = "mock_drone"
type = "vehicle"
[services.plugin]
plugin = "fake_drone"
package = "https://github.com/cmusatyalab/steeleagle_plugins//drivers/fake_drone@v4_backend_rework"
[services.plugin.args]
video = "mill_19_front.mp4"
no_loop = true
telemetry = true
decoder = "avdec_h264 max-threads=1"

[[services]]
name = "keyframe_filter"
type = "engine"
[services.plugin]
plugin = "keyframe"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/swiftmap@v4_backend_rework"
[services.plugin.args]
min_disparity = 60
send_distance = 5

[[services]]
name = "jpeg"
type = "engine"
[services.plugin]
plugin = "jpeg_encoder"
package = "https://github.com/cmusatyalab/steeleagle_plugins//defaults/thumbnail@v4_backend_rework"

[[services]]
name = "reachback"
type = "engine"
auth = "admin"
[services.plugin]
plugin = "reachback"
package = "https://github.com/cmusatyalab/steeleagle_plugins//engines/swiftmap@v4_backend_rework"
[services.plugin.args]
max_output_size = 6237184
remote = "swiftmap"
