# SwiftMap: drift replays mill_19_front.mp4, filters keyframes, JPEG-encodes them
# and sends them (with reachback for lost ones) to the swiftmap engine on lambda2,
# which feeds the SwiftMap server there (localhost:43322).
# malicious cuts the link for 20 s, one minute in.

[[experiments]]
name = "mill_19_front"
vehicle = "mock_drone"
[experiments.video]
# Already in drift's files directory, so not pushed; the link here gives its length (549 s)
video = "mill_19_front.mp4"
no_upload = true
flow = "flow_swiftmap.toml"
auto = true
# duration unset: each trial runs for the length of the video
[experiments.netsim]
profiles = ["outage"]
interface = "tailscale0"
port = 9001
trials = 1
failpoints = [[60, 20]] # used only by the malicious profile

# drift.toml and lambda2.toml are the daemons' configs for the experiment.
# drift has no ssh, so it has no prefix: it is only reached through lambda2.
[daemons]
[daemons.lambda2]
orchestrator = true
prefix = ""
[daemons.drift] # the name drift's daemon registers with
prefix = "xianglic@drift:"

[results]

[catalogs]
