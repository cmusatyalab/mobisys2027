# rgb -> keyframe_filter -> jpeg -> reachback (drift) ==network==> swiftmap (lambda2)
# Engine names are the services' names; the runner qualifies them (drift's local
# ones with drift's IP, swiftmap with lambda2's) before it sets the flow.

[[producers]]
name = "rgb"
tokens = 1

[[engines]]
name = "keyframe_filter"
location = "local"

[[engines]]
name = "jpeg"
location = "local"

[[engines]]
name = "reachback"
location = "local"

[[engines]]
name = "swiftmap"
location = "remote"

[[edges]]
from = "rgb"
to = "keyframe_filter"
timeout = "1s"

[[edges]]
from = "keyframe_filter"
to = "jpeg"
timeout = "1s"

[[edges]]
from = "jpeg"
to = "reachback"
timeout = "1s"

[[edges]]
from = "reachback"
to = "swiftmap"
timeout = "1s"
